<header class="navbar">
    <div class="nav-container">
        <a href="#home" class="brand" (click)="closeMenu()">
            <span class="brand-mark">&lt;/&gt;</span>
            <span class="brand-name">
                PEDRO<span>.</span>
            </span>
        </a>

        <!-- Desktop Navigation -->
        <nav class="desktop-nav">
            <a href="#home" [class.active]="activeSection === 'home'" (click)="setActive('home')">Home</a>
            <a href="#projects" [class.active]="activeSection === 'projects'"
                (click)="setActive('projects')">Projects</a>
            <a href="#skills" [class.active]="activeSection === 'skills'" (click)="setActive('skills')">Skills</a>
            <a href="#experience" [class.active]="activeSection === 'experience'"
                (click)="setActive('experience')">Experience</a>
            <a href="#contact" [class.active]="activeSection === 'contact'" (click)="setActive('contact')">Contact</a>
            <a href="#about" [class.active]="activeSection === 'about'" (click)="setActive('about')">About</a>
        </nav>

        <button class="theme-toggle" (click)="themeService.toggle()" aria-label="Toggle theme">
            @if (themeService.theme() === 'dark') {
            ☀️
            } @else {
            🌙
            }
        </button>
        <!-- <a href="#contact" class="contact-button" (click)="setActive('contact')">
            Let's talk <span>&rarr;</span>
        </a> -->
        <!-- Mobile menu toggle -->
        <button class="menu-button" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen" aria-label="Toggle menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </div>

    <!-- Mobile Navigation -->
    @if (menuOpen) {
    <nav class="mobile-nav" animate.enter="slide-in" animate.leave="slide-out">
        <a href="#home" (click)="setActive('home')">Home</a>
        <a href="#projects" (click)="setActive('projects')">Projects</a>
        <a href="#skills" (click)="setActive('skills')">Skills</a>
        <a href="#experience" (click)="setActive('experience')">Experience</a>
        <a href="#contact" (click)="setActive('contact')">Contact</a>
        <a href="#about" (click)="setActive('about')">About</a>
    </nav>
    }
</header>

<app-landing></app-landing>
